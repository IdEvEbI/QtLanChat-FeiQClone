# Markdownlint 配置文件
# QtLanChat-FeiQClone 项目文档规范

# 启用默认规则集
default: true

# 中文文档优化
MD013:
  line_length: 500
  code_blocks: false
  tables: false

# 列表和标题规范
MD007:
  indent: 2
MD012:
  maximum: 3
MD024:
  siblings_only: true

# 允许的灵活性
MD025:
  front_matter_title: ""
MD033: false # 允许 HTML 标签
MD040: false # 允许代码块不指定语言

# Qt 项目特定规则
MD041: false # 允许文件不以标题开头（适合 README）
MD022: false # 允许标题周围没有空行（适合紧凑格式）
MD032: false # 允许列表周围没有空行（适合紧凑格式）
MD036: false # 允许使用强调代替标题（适合阶段标题）
MD047: false # 允许文件不以换行符结尾
